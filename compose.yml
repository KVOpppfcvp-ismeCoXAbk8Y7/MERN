services:
  mongo:
    image: mongo:7
    env_file: .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks: [mern]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  express:
    build:
      context: ./express
    env_file: .env
    environment:
      PORT: ${EXPRESS_PORT}
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:${MONGO_PORT}/${MONGO_DB}?authSource=${MONGO_DB}&directConnection=true
      NODE_ENV: ${EXPRESS_NODE_ENV}
      RATE_LIMIT_WINDOW_MS: ${EXPRESS_RATE_LIMIT_WINDOW_MS}
      RATE_LIMIT_MAX: ${EXPRESS_RATE_LIMIT_MAX}
    volumes:
      - ./express:/app
      - /app/node_modules
    networks: [mern]
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${EXPRESS_PORT}/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  vite:
    build:
      context: ./vite
    env_file: .env
    volumes:
      - ./vite:/app
      - /app/node_modules
    networks: [mern]
    depends_on:
      express:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${VITE_PORT}/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_HOST}:${NGINX_HOST_PORT}:${NGINX_PORT}"
    networks: [mern]
    depends_on:
      express:
        condition: service_healthy
      vite:
        condition: service_healthy

volumes:
  mongo_data:

networks:
  mern:
    name: mern_network
