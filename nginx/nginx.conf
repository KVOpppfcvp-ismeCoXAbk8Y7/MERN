env EXPRESS_PORT;
env VITE_PORT;
env NGINX_PORT;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    limit_req_zone $binary_remote_addr zone=api_rps:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;

    log_format main '$remote_addr - $request_id - $remote_user [$time_local] "$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;


    upstream express_upstream {
        server express:${EXPRESS_PORT};
        keepalive 64;
    }

    upstream vite_upstream {
        server vite:${VITE_PORT};
        keepalive 32;
    }

    server {
        listen ${NGINX_PORT};
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        #add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'" always;
        #add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_pass http://vite_upstream;
        }

        location /api/ {
            if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|OPTIONS)$) { return 405; }
            client_max_body_size 2m;
            limit_req zone=api_rps burst=20 nodelay;
            limit_conn per_ip_conn 20;

            #auth_request /_authcheck;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-Id $request_id;
            proxy_connect_timeout 5;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_pass http://express_upstream;
        }

        #location = /_authcheck {
        #internal;
        #proxy_pass http://express_upstream/authz/check;
        #proxy_pass_request_body off;
        #proxy_set_header Content-Length "";
        #}

        location ~ /\.(git|hg|svn) {
            return 404;
        }
    }
}
