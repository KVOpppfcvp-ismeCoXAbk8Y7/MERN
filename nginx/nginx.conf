env EXPRESS_PORT;
env VITE_PORT;
env NGINX_PORT;

worker_processes auto;

events { worker_connections 1024; }

http {
    limit_req_zone $binary_remote_addr zone=api_rps:10m rate=5r/s;

    upstream express_upstream {
        server express:${EXPRESS_PORT};
        keepalive 64;
    }

    upstream vite_upstream {
        server vite:${VITE_PORT};
        keepalive 16;
    }

    server {
        listen ${NGINX_PORT};
        server_name _;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://vite_upstream;
        }

        location /api/ {
            if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|OPTIONS)$) { return 405; }
            client_max_body_size 2m;
            limit_req zone=api_rps burst=20 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-Id $request_id;
            proxy_read_timeout 30s;
            proxy_pass http://express_upstream;
        }
    }
}
